<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parceiros</title>
    <!-- CSS do bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- icons do bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS da minha app -->
    <link rel="stylesheet" href="../css/parceiros.css">
</head>

<body>

    <!-- Conteúdo principal, centrado e com espaço em cima e em baixo -->
    <main class="container py-5">

        <!-- Secção dos parceiros, com texto centrado -->
        <section class="parceiros text-center">

            <!-- Título com linha roxa por baixo -->
            <h1 class="titulo-parceiros mb-4">Parcerias e certificações</h1>

            <!-- Texto de apresentação -->
            <p class="mb-5 text-muted">
                A qualidade da formação e das certificações do CESAE Digital é possível graças ao apoio dos nossos parceiros.
            </p>

            <!-- Grelha de logos, cada um é um link para o site do parceiro -->
            <div class="parceiros-logos">
                <a href="https://www.checkpoint.com/mind/secureacademy/" target="_blank" class="cartao-parceiro">
                    <img src="../images/checkpoint.png" alt="Check Point SecureAcademy">
                </a>
                <a href="https://www.cisco.com/c/m/en_sg/partners/cisco-networking-academy/index.html" target="_blank" class="cartao-parceiro">
                    <img src="../images/cisco.png" alt="Cisco Networking Academy">
                </a>
                <a href="https://aws.amazon.com/pt/training/awsacademy/" target="_blank" class="cartao-parceiro">
                    <img src="../images/aws.png" alt="AWS Academy">
                </a>
                <a href="https://www.kryterion.com/" target="_blank" class="cartao-parceiro">
                    <img src="../images/kryterion.png" alt="Kryterion">
                </a>
                <a href="https://www.meazurelearning.com/" target="_blank" class="cartao-parceiro">
                    <img src="../images/meazure.jpg" alt="Meazure Learning">
                </a>
                <a href="https://www.autodesk.com/" target="_blank" class="cartao-parceiro">
                    <img src="../images/autodesk.png" alt="Autodesk">
                </a>
                <a href="https://www.sage.com/pt-pt" target="_blank" class="cartao-parceiro">
                    <img src="../images/sage.png" alt="Sage">
                </a>
                <a href="https://www.aeportugal.pt/" target="_blank" class="cartao-parceiro">
                    <img src="../images/aep.png" alt="AEP - Associação Empresarial de Portugal">
                </a>
                <a href="https://www.pearsonvue.com/" target="_blank" class="cartao-parceiro">
                    <img src="../images/pearson.png" alt="Pearson VUE">
                </a>
            </div>
        </section>

    </main>

    <!-- JS do bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
